<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="ap-pillar" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#157c88" stop-opacity="0"/>
      <stop offset="35%" stop-color="#157c88" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.12"/>
